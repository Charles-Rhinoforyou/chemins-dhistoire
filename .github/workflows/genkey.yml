name: Generate keystore

# Génère une seule fois un keystore de signature STABLE, téléchargeable en artefact.
on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Générer le keystore
        run: |
          keytool -genkeypair -v \
            -keystore chemins.jks \
            -alias chemins \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass cheminsdhistoire -keypass cheminsdhistoire \
            -dname "CN=Chemins d'Histoire, OU=App, O=Chemins d'Histoire, L=Paris, C=FR"

      - name: Publier le keystore en artefact
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: chemins.jks
